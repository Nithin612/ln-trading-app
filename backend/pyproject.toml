[project]
name = "trading-platform-backend"
version = "0.1.0"
description = "Intelligent stock-suggestion and algo-trading platform for Indian markets (NSE/BSE)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.10.0",
    "PyJWT>=2.10.0",
    "bcrypt>=4.2.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "pandas-ta>=0.4.71b0",
    "kiteconnect>=5.0.1",
    "websockets>=13.0",
    "pdfplumber>=0.11.0",
    "hiredis>=3.4.0",
    "statsmodels>=0.14.6",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "maturin>=1.14.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C90"]
ignore = [
    "B008",   # FastAPI uses function calls in Depends()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# `scripts/` is now type-checked too (make typecheck runs `mypy app/ scripts/`).
# Reason: it was NEVER checked, and that hid a real bug — 2026-09-02, adding a
# required `mode` param to `regime_gate_shadow.render_markdown` updated every caller
# except `scripts/regime_gate_shadow.py`, and mypy's clean run over `app/` proved
# nothing. That script is the one the regime-gate forward-evidence protocol says to
# run by hand, so it would have died with a TypeError at exactly the wrong moment.
#
# The nine modules below are GRANDFATHERED at the state they were in when the check
# was switched on (64 pre-existing errors: mostly untyped experiment/backfill helpers).
# They are exempt so switching the check on didn't redden the gate — NOT because they
# are exempt in principle. Fix and delete an entry when you touch one; never add a new
# entry for new code.
[[tool.mypy.overrides]]
module = [
    "adjudication_experiments",
    "adjudication_experiments_fgh",
    "backfill_intraday",
    "bench_baseline",
    "gen_options_goldens",
    "generate_engine_fixtures",
    "seed_nse_holidays",
    "seed_stocks",
    "signal_filter_shadow",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "parity: cross-language Python-vs-Rust parity tests (real-DB golden corpus)",
    "walkforward: walk-forward golden replay against the dev-DB corpus (§8 drift gate)",
    "replay: live-engine record/replay goldens (byte-identical event streams; make replay)",
]
