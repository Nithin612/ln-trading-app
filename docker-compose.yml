# Phase 0 — local dev infrastructure
# Postgres + TimescaleDB for relational + time-series data
# Redis for caching, pub/sub, session storage, and Celery broker
# App services (backend, frontend, celery workers) added in later phases.

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tpuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tppass}
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tpuser} -d ${POSTGRES_DB:-trading_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tp_network

  redis:
    image: redis:7-alpine
    container_name: tp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # volatile-lru: only keys WITH a TTL are evictable. Celery broker/queue keys
    # carry no TTL, so they can never be silently dropped under memory pressure;
    # cache keys (ltp:*, etc.) must always be SET with an expiry.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tp_network

  # Lightweight DB UI for visual inspection during development.
  # Comment this out in production.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tp_network
    profiles:
      - tools  # only starts with `docker compose --profile tools up`

volumes:
  postgres_data:
    name: tp_postgres_data
  redis_data:
    name: tp_redis_data

networks:
  tp_network:
    name: tp_network
    driver: bridge
