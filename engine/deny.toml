# cargo-deny — supply-chain gate for the engine/ Rust workspace (A39).
#
# Run:  make engine-audit   (installs the tool with `cargo install cargo-deny` if missing)
#
# Why this exists. The engine is a from-scratch numeric core with a deliberately tiny
# dependency tree (39 crates as of 2026-09-09). Our Rust rules already forbid panics and pin
# an exact pandas-ta parity oracle, but there was NO gate on where those crates come from,
# what they are licensed under, or whether any carries a RustSec advisory. This closes that:
#
#   1. advisories — fail on a known vulnerability or a yanked crate.
#   2. licenses   — fail if a crate's license is not on the permissive allow-list. Copyleft
#                   is a NON-ISSUE for personal use but a real problem at the productization
#                   the platform anticipates (external-libs review: vectorbt's Commons Clause,
#                   NautilusTrader's LGPL) — so a copyleft dep must be a conscious decision,
#                   surfaced here, never a silent transitive surprise.
#   3. sources    — crates.io only; no ad-hoc git or unknown registries.
#
# The allow-list was derived from the actual tree (`cargo metadata`): every dep is
# MIT / Apache-2.0 / Unicode-3.0 / Unlicense today. The three UNLICENSED crates are OUR OWN
# (publish = false) and are skipped via `private.ignore`.

[advisories]
version = 2
# A yanked crate is treated as hard as a vulnerability — a yank usually means "do not use".
yanked = "deny"
# Add a RUSTSEC id here ONLY with a written reason and a tracking note; an empty list is the
# healthy state.
ignore = []

[licenses]
version = 2
# Permissive licenses present in the tree, plus a little standard-permissive headroom. A
# license NOT on this list fails the gate by design.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
# Our own workspace crates declare `license = "UNLICENSED"` and `publish = false`; do not fail
# the gate on them.
private = { ignore = true }
confidence-threshold = 0.9

[bans]
# A small tree is the point — flag the same crate resolving to several versions so the graph
# does not quietly bloat. `warn`, not `deny`: a transitive duplicate is common and is not
# itself a security problem.
multiple-versions = "warn"
# No `foo = "*"` — every dependency pins a version (parity reproducibility depends on it).
wildcards = "deny"
# Hard-ban a specific crate by adding it here, e.g. { name = "openssl" }.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
