[package]
name = "engine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native CLI for replay/bench of engine-core without Python."

[lints]
workspace = true

[[bin]]
name = "engine-cli"
path = "src/main.rs"

[dependencies]
engine-core = { path = "../engine-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
